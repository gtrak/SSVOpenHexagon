[package]
name = "oh-net"
description = "Byte-exact port of SSVOpenHexagon's Online wire protocol (SFML Packet codec, CTSP/STC packets, libsodium key exchange + secretbox, protocol version)"
version.workspace = true
edition.workspace = true

[dependencies]
# The `sf::Packet`-compatible wire codec is oh-replay's `Packet` (pinned to
# the same fork source and the same oracle vectors — see src/packet.rs).
# oh-net also needs oh-replay's `ReplayFile`/`CompressedReplayFile`
# packet forms for `CTSPReplay`/`CTSPCompressedReplay`.
oh-replay = { path = "../oh-replay" }
# libsodium bindings — see .agents/skills/lib-libsodium.md for the exact
# primitive mapping (crypto_kx, crypto_secretbox(_open)_easy,
# crypto_generichash, randombytes).
sodiumoxide = { workspace = true }
# rusqlite (bundled) — the `Online/Database` port (issue 17, src/database.rs);
# DECISIONS.md D-004 SQLite entry.
rusqlite = { workspace = true }

[dev-dependencies]
# Test-only: isolated on-disk DB files for the `Database` round-trip tests.
tempfile = { workspace = true }
