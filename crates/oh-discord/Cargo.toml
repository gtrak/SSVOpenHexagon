[package]
name = "oh-discord"
description = "The Discord `discord_manager` port (src/SSVOpenHexagon/Core/Discord.cpp): init + the three rich-presence setters behind a `DiscordCore` seam (the real IPC impl via `discord-rich-presence`, the contract's documented fallback for the absent official-SDK crate; the no-SDK default degrades exactly like the C++'s Android arm)"
version.workspace = true
edition.workspace = true

[dependencies]
# The real IPC implementation (issue 21 binding decision — see
# .agents/skills/lib-discord.md): the official Discord Game SDK has no sound
# Rust crate, so the port speaks the Discord IPC protocol to the local
# client. Pure Rust, small dep set; `init` fails (gracefully) when no local
# Discord client is running — the game's degradation path.
discord-rich-presence = "1.1"
