[package]
name = "oh-game"
description = "Gameplay data types (walls, player, custom walls, status, ticker, timelines) ported from SSVOpenHexagon, with exact formulas/constants/float types"
version.workspace = true
edition.workspace = true

[dependencies]
oh-math = { path = "../oh-math" }
oh-rng = { path = "../oh-rng" }
oh-data = { path = "../oh-data" }
oh-config = { path = "../oh-config" }
oh-replay = { path = "../oh-replay" }
oh-assets = { path = "../oh-assets" }
# Issue 21: the Discord `discord_manager` seam (the C++
# `Discord::discord_manager* discordManager`, HexagonGame.hpp:88 — nullable;
# the retry state `discordAttempt`/`discordHung` live on the engine, not the
# manager, so only the `Discord` trait surface is needed here).
oh-discord = { path = "../oh-discord" }

# Issue 009 composition/tests only — never a normal dependency (that would
# cycle: oh-lua already depends on oh-game).
[dev-dependencies]
oh-lua = { path = "../oh-lua" }

[features]
# D-023/D-024: mirror oh-lua's `produce-lua-metadata` (the C++
# `SSVOH_PRODUCE_LUA_METADATA` build gate, `CMakeLists.txt`'s literal
# `if(FALSE)` = default OFF) for the engine's console tests: with the
# feature on, the `init_lua_and_print_docs_to` headless test sees the
# flag-ON metadata store (entry lines + resolved lookups); default builds
# see the shipped flag-OFF behavior (11 headers, zero entries,
# "UNKNOWN FUNCTION"). Forwarded onto the dev-dependency only — oh-game
# itself gains no dependency (oh-lua is already dev-only here, D-013).
produce-lua-metadata = ["oh-lua/produce-lua-metadata"]
