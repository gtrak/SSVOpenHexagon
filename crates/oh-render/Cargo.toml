[package]
name = "oh-render"
description = "SFML-analogue render backend for the SSVOpenHexagon Rust port (window, input, vertex batch, texture, font/text, view/camera, shader, audio device) — real-GL stack per DECISIONS.md D-004 (SFML entry)"
version.workspace = true
edition.workspace = true

[dependencies]
# Exact SFML Keyboard::Key / Mouse::Button integers (D-004 SFML entry) —
# reused rather than duplicated.
oh-config = { path = "../oh-config" }
# Vec2 (sf::Vector2f analogue), Color (sf::Color analogue), angle/geometry
# helpers (ssvu::PI/to_rad, ssvs getRad/getVecFromRad/getMag).
oh-math = { path = "../oh-math" }

# --- real-GL platform stack (D-004 SFML entry) -----------------------------
# Raw window/display handles (shared: the desktop + android bootstrap read
# them; the web path keeps the dependency, it just has no winit window).
raw-window-handle = "0.6"
# GL function loader. On desktop/android the entry points come from the
# glutin display's proc table; on emscripten from
# `emscripten_webgl_get_proc_address` (the W1 route, `gl.rs`).
glow = "0.18"
# TTF metrics + glyph rasterization (pure-Rust; glyph atlases become GL
# textures in the Font/Text path).
fontdue = "0.9"
# Audio device surface (play/stop/pitch/volume/playing-offset).
rodio = "0.23"
# PNG encode + decode — the window layer's own image surface (D-004 SFML
# entry): the real `GameWindow::saveScreenshot` (GameWindow.hpp:167-174)
# PNG-encodes the `glReadPixels` readback, and the window-icon load
# (C++ main.cpp:312-328) PNG-decodes `Assets/icon.png`. In the C++ the PNG
# codec lives INSIDE SFML (the window layer's own dependency —
# `ImageLoader.cpp:262` `stbi_write_png`, stb_image_write v1.16); the
# `png` crate is its sound Rust analogue: pure Rust, no C deps, exactly
# the encode + decode this layer needs. `image` was rejected (it pulls a
# whole format zoo + optional rayon/num deps this layer does not use),
# and a hand-rolled PNG encoder/decoder is rejected on the same bar as the
# D-004 SFML entry's hand-rolled rasterizer: smallest SOUND dependency.
png = "0.18"

# --- desktop / android window + GL backend (W1 target-gate) ---------------
# `winit` + `glutin` have NO emscripten backend (W0 finding: winit's web
# backend is `target_os = "unknown"`-only — `build.rs` `compile_error!` on
# emscripten; glutin `compile_error!("Please select at least one api
# backend")`), so the web path uses the emscripten C API + `web-sys`
# instead (the `cfg(target_os = "emscripten")` table below + the `gl.rs` /
# `window.rs` web backends).
# `android-native-activity` (DECISIONS.md D-026: native-activity, not
# game-activity): winit 0.30's android backend compiles `android-activity`
# only behind this feature (it hard-errors without it, E0583 + compile_error).
# Harmless on desktop: winit gates the `android-activity`/`ndk` deps on
# `cfg(target_os = "android")`, so the feature enables nothing on
# non-android targets and the lockfile graph is unchanged.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
# GL context + GL function loader. The context is created with glutin's
# `Display::new(event_loop.as_raw(), <api preference>)` + a winit window (raw
# handles from `raw-window-handle`); `glow` loads the GL entry points.
glutin = "0.32"

# --- emscripten (web) window + GL backend (W1) -----------------------------
# The canvas + WebGL2 context come from the emscripten C API
# (`emscripten_webgl_*`, `gl.rs`); the DOM events + the
# `request_animation_frame` loop come from `web-sys` (`window.rs`).
# `DomRect` is required for the `canvas_position` bounding-rect origin
# (`HtmlCanvasElement::get_bounding_client_rect` → `DomRect::left/top`).
[target.'cfg(target_os = "emscripten")'.dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = [
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "console",
  "Performance",
  "Event",
  "EventTarget",
  "KeyboardEvent",
  "WheelEvent",
  # issue 32 — the pointer event model (the DOM `pointerdown` /
  # `pointermove` / `pointerup` / `pointercancel` feed; the `TouchEvent`
  # / `MouseEvent` features went with the listeners it replaced):
  # `PointerEvent` (the event type + `pointer_id` / `pointer_type`) +
  # `set_pointer_capture` (the `Element` method, the stuck-down guard)
  # + `VisibilityState` (the `visibilitychange`'s hidden state) +
  # `DomRect` (the canvas's bounding-rect origin + the CSS box size the
  # REAL window size is in, the CSS-px × `devicePixelRatio` product).
  "PointerEvent",
  "VisibilityState",
  "DomRect",
] }

[dev-dependencies]
