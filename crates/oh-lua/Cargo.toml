[package]
name = "oh-lua"
version.workspace = true
edition.workspace = true

[dependencies]
thiserror = { workspace = true }
# The game API (issue 007) registers over the concrete gameplay/data types
# owned by these crates (LevelStatus, HexagonGameStatus, StyleData, the
# timelines, the custom-wall manager, the RNG). The game loop (issue 009)
# implements the `GameApi` backend trait against its own state.
oh-game = { path = "../oh-game" }
oh-data = { path = "../oh-data" }
oh-math = { path = "../oh-math" }
oh-rng = { path = "../oh-rng" }

# mlua backend per target: LuaJIT on desktop (the C++ build's backend),
# Luau on emscripten (LuaJIT cannot build for wasm — its JIT is not
# wasm-viable and its C build script needs `make`).
# `vendored` is REQUIRED on wasm (mlua-sys/build/find_normal.rs panics
# without it). See .agents/skills/lib-mlua.md §WASM.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
mlua = { version = "0.10", features = ["luajit", "vendored"] }

[target.'cfg(target_os = "emscripten")'.dependencies]
mlua = { version = "0.10", features = ["luau", "vendored"] }

[features]
# C++ `SSVOH_PRODUCE_LUA_METADATA` (D-023/D-024): the shipped C++ build has
# the flag OFF (`CMakeLists.txt` sets it through a literal `if(FALSE)`), so
# the default build records no metadata at all: `print_docs` emits the 11
# category headers and nothing else, `get_all_function_names()` is empty,
# and `get_docs_for_function` returns `"UNKNOWN FUNCTION"`. Enabling the
# feature mirrors the flag-ON build (the `LuaMetadataProxy` destructor
# records the entry).
produce-lua-metadata = []
