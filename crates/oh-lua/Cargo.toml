[package]
name = "oh-lua"
version.workspace = true
edition.workspace = true

[dependencies]
# mlua on the LuaJIT feature: the C++ build bundles LuaJIT
# (see extlibs + CMakeLists.txt pin, and .agents/skills/lib-luajit.md).
# `vendored` compiles LuaJIT from source into the binary (the C++ likewise
# compiles LuaJIT in). NOTE (issue 029k1): this is NOT bit-for-bit the C++
# build — the C++ pins `vittorioromeo/LuaJIT @ 4dc5ffbf` (plain upstream
# v2.1 + CMake, 2023-04-02) built with `LUAJIT_DISABLE_FFI=ON`; the port
# vendors upstream LuaJIT @ `a4f56a4` (2025-01-13) via
# `luajit-src 210.5.12+a4f56a4`, patched locally (extlibs/luajit-src,
# [patch.crates-io]) to compile with `-DLUAJIT_DISABLE_FFI` as well. See
# .agents/plans/001-rust-port/deviations.md (K3 / LuaJIT rows) and
# .agents/tasks/issue-029k1-luajit-version-and-anr.md.
mlua = { version = "0.10", features = ["luajit", "vendored"] }
thiserror = { workspace = true }
# The game API (issue 007) registers over the concrete gameplay/data types
# owned by these crates (LevelStatus, HexagonGameStatus, StyleData, the
# timelines, the custom-wall manager, the RNG). The game loop (issue 009)
# implements the `GameApi` backend trait against its own state.
oh-game = { path = "../oh-game" }
oh-data = { path = "../oh-data" }
oh-math = { path = "../oh-math" }
oh-rng = { path = "../oh-rng" }

[features]
# C++ `SSVOH_PRODUCE_LUA_METADATA` (D-023/D-024): the shipped C++ build has
# the flag OFF (`CMakeLists.txt` sets it through a literal `if(FALSE)`), so
# the default build records no metadata at all: `print_docs` emits the 11
# category headers and nothing else, `get_all_function_names()` is empty,
# and `get_docs_for_function` returns `"UNKNOWN FUNCTION"`. Enabling the
# feature mirrors the flag-ON build (the `LuaMetadataProxy` destructor
# records the entry).
produce-lua-metadata = []

# Compiles ffi_stub.c (the `luaopen_ffi` link-compat shim — see that file
# and issue 029k1): mlua's `luajit` feature references the symbol at link
# time even though the FFI-less VM and the port's safe mode never call it.
[build-dependencies]
cc = "1.0"
