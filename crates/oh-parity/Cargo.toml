[package]
name = "oh-parity"
description = "Issue 23: the SSVOpenHexagon Rust-port parity harness — runs the pinned level/seed/input corpus through the Rust build and compares outcomes against C++-derived expectations (tools/oracle/parity_probe.cpp)"
version.workspace = true
edition.workspace = true
# The parity crate is a TESTS crate: an empty lib (the crate's docs +
# `cargo test -p oh-parity` discovery) and the corpus-driven tests under
# `tests/`. No shipped API.

[dependencies]

# Parity level-run composition — the same dev-only dependency shape oh-game
# uses for its own determinism harness (oh-lua depends on oh-game, so it is
# never a normal dependency; D-013).
[dev-dependencies]
oh-math = { path = "../oh-math" }
oh-rng = { path = "../oh-rng" }
oh-replay = { path = "../oh-replay" }
oh-data = { path = "../oh-data" }
oh-config = { path = "../oh-config" }
oh-assets = { path = "../oh-assets" }
# D-037: the Lua VM is Luau (oh-lua's single `mlua/luau` build) — the whole
# parity suite (including the differential-simulation harness, the VM probes
# and the C++ fingerprint column) runs under it. The committed C++ vectors
# (`parity/cpp_fingerprints.json`) are the reference: the port's shipping
# configuration is the one compared against the C++ (030c: 3627/3627 frames).
oh-lua = { path = "../oh-lua" }
# The `mlua::Integer` width probe names the FFI integer type directly; the
# `luau` feature (with mlua's defaults off) keeps exactly one VM in the
# build graph, mirroring oh-lua's own dependency.
mlua = { version = "0.10", default-features = false, features = ["luau"] }
oh-game = { path = "../oh-game" }
serde = { workspace = true }
serde_json = { workspace = true }
