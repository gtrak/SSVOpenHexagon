[package]
name = "oh-app"
description = "The application composition crate (D-020): the draw bridge that drives oh_render::graphics::draw_frame from the engine's state — boot/CLI (15b) and the windowed loop (15c) land here next"
version.workspace = true
edition.workspace = true

[lib]
# Library + the `open-hexagon` binary (issue 15 step (b)); the windowed
# loop (step (c)) lands in the same binary.

[dependencies]
# The two sides of the bridge: the engine (never depends on the render
# layer) and the render layer (never depends on the engine). `oh-app` is
# the composition crate that depends on BOTH (DECISIONS.md D-020; D-013:
# oh-game must not gain oh-render — oh-lua depends on oh-game, so the
# adapter cannot live in oh-game or oh-render).
oh-game = { path = "../oh-game" }
oh-render = { path = "../oh-render" }
oh-config = { path = "../oh-config" }
oh-math = { path = "../oh-math" }
oh-data = { path = "../oh-data" }
# The step-(b) composition (`compose.rs`) implements the `ScriptHost`
# seam over `oh-lua` IN THE LIB (promoted from the step-(a) test tree per
# the 15b spec): `oh-app -> oh-lua -> oh-game` is acyclic, and the binary
# (same package) needs the Lua host to run `-printLuaDocs` / headless
# replays. Step (a)'s "dev-only" constraint was about the DRAW BRIDGE not
# coupling to the Lua backend; the composition crate legitimately does.
oh-lua = { path = "../oh-lua" }
oh-assets = { path = "../oh-assets" }
oh-replay = { path = "../oh-replay" }
oh-rng = { path = "../oh-rng" }

[features]
# D-023/D-024: forward onto oh-lua so the `open-hexagon` binary's
# `-printLuaDocs` (and any composition in this package) sees the flag-ON
# metadata store when the workspace is built with the feature (the C++
# `SSVOH_PRODUCE_LUA_METADATA` build; default OFF = the shipped build).
produce-lua-metadata = ["oh-lua/produce-lua-metadata"]

[dev-dependencies]
