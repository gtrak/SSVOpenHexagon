[package]
name = "oh-app"
description = "The application composition crate (D-020): the draw bridge that drives oh_render::graphics::draw_frame from the engine's state — boot/CLI (15b) and the windowed loop (15c) land here next"
version.workspace = true
edition.workspace = true

[lib]
# Library + the `open-hexagon` binary (issue 15 step (b)); the windowed
# loop (step (c)) lands in the same binary.

[[bin]]
name = "open-hexagon"
path = "src/main.rs"

[dependencies]
# The two sides of the bridge: the engine (never depends on the render
# layer) and the render layer (never depends on the engine). `oh-app` is
# the composition crate that depends on BOTH (DECISIONS.md D-020; D-013:
# oh-game must not gain oh-render — oh-lua depends on oh-game, so the
# adapter cannot live in oh-game or oh-render).
oh-game = { path = "../oh-game" }
oh-render = { path = "../oh-render" }
oh-config = { path = "../oh-config" }
oh-math = { path = "../oh-math" }
oh-data = { path = "../oh-data" }
# The step-(b) composition (`compose.rs`) implements the `ScriptHost`
# seam over `oh-lua` IN THE LIB (promoted from the step-(a) test tree per
# the 15b spec): `oh-app -> oh-lua -> oh-game` is acyclic, and the binary
# (same package) needs the Lua host to run `-printLuaDocs` / headless
# replays. Step (a)'s "dev-only" constraint was about the DRAW BRIDGE not
# coupling to the Lua backend; the composition crate legitimately does.
oh-lua = { path = "../oh-lua" }
oh-assets = { path = "../oh-assets" }
oh-vfs = { path = "../oh-vfs" }
oh-menu = { path = "../oh-menu" }
oh-replay = { path = "../oh-replay" }
oh-rng = { path = "../oh-rng" }
# Issue 21: the Discord manager (the C++ `main.cpp:264-269` `discordManager`,
# created only when NOT headless). The windowed composition builds the real
# IPC impl (`IpcDiscordCore`); headless/server/printLuaDocs pass `None`.
oh-discord = { path = "../oh-discord" }
# Issue 18 milestone 4: the `-server` wiring (`dispatch.rs::main_server`
# — the C++ `mainServer`, main.cpp:197-242) over the ported
# `HexagonServer` + the `Database`/`ReplayExecutor` composition.
# OFF on emscripten (sub-goal 5B, link-time): the web vertical slice has no
# online client / server (26c §5 — the online *client* is a follow-up), and
# `oh-net`'s C deps do not LINK for emscripten on a Windows host
# (`libsodium-sys`'s build script takes its `#[cfg(windows)]` prebuilt-libs
# shortcut — the host's mingw/msvc statics — which emcc cannot consume; the
# sub-goal 5a `cargo check` never linked, so this only surfaces at the
# first real `cargo build`). `dispatch` (the only `oh_net` consumer in this
# crate) is already `#[cfg(not(target_os = "emscripten"))]`; the dep joins
# the not-emscripten target table below.

# Issue 020 — the Steam manager the `mainClient` composition shares with
# the engine (`HexagonGame`'s `steam_manager` seam) and the menu
# (the `MenuGame::init`-lifecycle calls); `src/steam.rs` picks the
# backend (feature `steam` = the real SDK, default = `NoSteam`).
oh-steam = { path = "../oh-steam" }

# The windowed / console / server stack is desktop-only (sub-goal 4A):
# `winit` has no emscripten backend (its web backend is
# `target_os = "unknown"`-only — D-029 drops winit on the web path), and
# the egui console + the `-server` path are not part of the web vertical
# slice (26c §5). Gating them off `wasm32-unknown-emscripten` (same
# versions) keeps the desktop build byte-identically unchanged while
# letting `oh-app` COMPILE for emscripten; the real web client lands in
# the `oh-web` crate (sub-goal 4B).
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
# Issue 18 milestone 4: the `-server` wiring (`dispatch.rs::main_server`)
# — the only `oh_net` consumer in this crate (the `dispatch` module, the
# `-server` entry, is `#[cfg(not(target_os = "emscripten"))]`). Gated off
# emscripten for the link-time reason in the `oh-net` note above (sub-goal
# 5B): `oh-net`'s `sodiumoxide` / `rusqlite` C deps do not link for
# emscripten on a Windows host.
oh-net = { path = "../oh-net" }
# C++ main.cpp:340-349 — the SIGINT handler, the SAFE port (the C++'s
# `TODO (P2): UB`, main.cpp:339: the C++ handler called
# `globalWindow.stop()` — non-atomic engine state — inside the signal
# context). `signal-hook`'s `flag::register` keeps the signal context to
# a single atomic store on the `WindowedClient`'s interrupt flag; the
# loop head (the C++'s `while(isRunning())` position) performs the stop.
# The web loop is a plain `request_animation_frame` — no signal handler.
signal-hook = "0.3"
# Issue 014b — the egui Lua console overlay (DECISIONS.md D-022, verified
# against the D-011 stack: egui 0.37 + egui-winit 0.37 + egui_glow 0.37
# coexist with winit 0.30.13). The overlay lives HERE (composition, like
# the draw bridge) — `oh-game` stays egui-free (headless stays clean).
# D-022 caveat: `egui_glow 0.37` pulls `glow 0.17` while `oh-render`
# uses `glow 0.18` — different Rust types over the SAME GL context; the
# console builds its own glow-0.17 context from
# `oh_render::GlParts::proc_address` (never from `oh-render`'s context).
egui = "0.37"
egui-winit = { version = "0.37", default-features = false, features = ["links"] }
egui_glow = "0.37"
# The console's own GL loader (the D-022 glow-0.17 half — coexists in the
# lockfile with `oh-render`'s `glow 0.18`).
glow = "0.17"
# The console's event hook sees the window's raw winit events (the C++
# `runEvents`'s per-event `gameEngine->handleEvent`, GameWindow.hpp:79;
# the D-011 stack's `winit 0.30.13` — the same major the lockfile pins).
# The `android-native-activity` feature (D-026, issue 25b): the same
# feature + version oh-render already unifies workspace-wide (the lockfile
# graph is unchanged) — it enables the `winit::platform::android` surface
# the `android.rs` entry module (issue 25b) consumes on the android target.
winit = { version = "0.30", features = ["android-native-activity"] }

[target.'cfg(target_os = "android")'.dependencies]
# Issue 25b SG4: the APK asset extraction — the `AAssetManager` traversal
# (`open_dir`/`open`) that copies the `_RELEASE` content tree out of the
# APK's `assets/` on first run. `0.9.0` is already in the lockfile (the
# `android-activity` dependency) — no version change; winit's `AndroidApp::
# asset_manager()` returns this crate's `AssetManager` directly.
ndk = "0.9"

[features]
# Issue 020: the real Steam backend (the C++'s `#ifndef SSVOH_ANDROID`
# build — links the official loader stub via `steamworks-sys`; degrades
# at runtime when no Steam client is running). OFF by default = the
# C++'s no-SDK branch (CI has no Steam; see `.agents/skills/
# lib-steamworks.md` §4 + `src/steam.rs`).
steam = ["oh-steam/steam"]
# D-023/D-024: forward onto oh-lua so the `open-hexagon` binary's
# `-printLuaDocs` (and any composition in this package) sees the flag-ON
# metadata store when the workspace is built with the feature (the C++
# `SSVOH_PRODUCE_LUA_METADATA` build; default OFF = the shipped build).
produce-lua-metadata = ["oh-lua/produce-lua-metadata"]

[dev-dependencies]
tempfile = { workspace = true }
