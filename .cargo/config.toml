# Issue 22 — Windows cross-compile target config (x86_64-pc-windows-gnu).
#
# -ladvapi32: the cross-built static libsodium 1.0.18 (the D-004 pin, via
# sodiumoxide 0.2.7 — prebuilt for the canonical MinGW triple by
# tools/build-windows.sh, linked through SODIUM_LIB_DIR) references exactly
# one Windows platform symbol, SystemFunction036 (the random-bytes
# RtlGenRandom path, randombytes_sysrandom.c:366), which lives in advapi32.
# The libsodium build system does not record platform Libs.private for the
# MinGW static build, so the final executables (the ones linking oh-net's
# sodiumoxide) must carry it here. Target-scoped: zero effect on the Linux
# gate or the MSVC CI target (whose libsodium comes from the native
# toolchain's own link line).
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-arg=-ladvapi32"]

# Issue 25 — Android NDK (aarch64): the NDK's per-API clang wrapper is a
# self-contained linker (sysroot + libc++_shared semantics); the cc-rs crates
# (luajit-src, libsodium-sys) get CC/AR/CXX_<target> env vars from
# tools/android-env.sh (the cargo-ndk equivalent, without the tool).
# Issue 25b SG6 — the 16KB-page-size alignment (Android 15's 16KB OEM
# devices): the NDK r27c lld DEFAULT is 4KB ELF LOAD alignment (verified
# empirically: llvm-readelf -l on an NDK-linked .so shows align 0x1000
# on the API-28 AND the API-35 clang targets), so -z max-page-size=16384
# is added at link time to make the .so 16KB-aligned (align 0x4000 — a
# superset: it still loads on 4KB-page devices; the APK is thereby
# 16KB-page-ready). Target-scoped (zero effect on the desktop gate);
# link-arg hits only final links (the cdylib / any android bin).
[target.aarch64-linux-android]
linker = "aarch64-linux-android28-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

# Issue 25 — Android x86_64 (emulator smoke): same scheme as aarch64.
# (x86_64 Android stays 4KB-page — no 16KB rustflags needed here.)
[target.x86_64-linux-android]
linker = "x86_64-linux-android28-clang"

# Issue 26c (sub-goal 4b) — Emscripten (web) target: the VERBATIM
# 26c.1/26c.2 build recipe (DECISIONS.md D-029, .agents/skills/lib-web-stack.md
# §"26c.1 — Emscripten target (verified)" + §"26c.2 — Luau + wasm-bindgen +
# glow in one emscripten module (verified)"). Consumed by the `oh-web`
# binary (the wasm32-unknown-emscripten web entry — the whole app in ONE
# module: Lua + engine + web-sys + glow, D-029; `winit` is dropped on the
# web path, the loop is a plain `request_animation_frame`).
#
# - emsdk 6.0.x ships emcc.exe (no emcc.bat); point the linker at it
#   explicitly.
# - `-sWASM_BINDGEN`: wasm-bindgen as a BIN crate — emcc runs the
#   wasm-bindgen CLI itself over the linked wasm (Emscripten >= 6.0.10;
#   this box: 6.0.12). The CLI comes from ~/.cargo/bin (on the build PATH).
# - `-sDEFAULT_TO_CXX` (the 26c.2 MANDATORY gotcha #1): emcc's linker
#   driver does NOT auto-link the C++ EH runtime for the mixed Rust+C++
#   module (Luau's objects leave `__gxx_wasm_personality_v0`,
#   `__cxa_throw`, ... undefined). Linking with `-fwasm-exceptions` is NOT
#   needed — emscripten 6.0.x's prebuilt libcxxabi already provides those
#   symbols.
# - `-sMAX/MIN_WEBGL_VERSION=2` (the 26c.1 MANDATORY gotcha): without them
#   emscripten logs "WebGL 2 requested but only WebGL 1 is supported" and
#   `emscripten_webgl_create_context` returns 0.
# - MODULARIZE + EXPORT_ES6: the artifacts are a loadable ES module
#   (`oh-web.js` default-exports the Module factory) + `oh-web.wasm`.
# - The 26c.2 MANDATORY gotcha #2 lives in the CODE, not here: `main()`
#   calls `__wasm_call_ctors()` as its FIRST statement (the wasm-bindgen
#   glue registers `main` via `addOnInit`, which runs BEFORE emscripten's
#   `wasmExports['__wasm_call_ctors']()` — otherwise the C++ static
#   initializers (Luau's `kSizeClassConfig`) never run and Luau traps on a
#   silent divide-by-zero).
# Target-scoped: zero effect on the desktop / android builds. (Deliberately
# NO `[build] target` line — the desktop gate keeps its host default.)
[target.wasm32-unknown-emscripten]
linker = "emcc.exe"
rustflags = [
  "-Cpanic=abort",
  "-Cllvm-args=-enable-emscripten-cxx-exceptions=0",
  "-Crelocation-model=static",
  "-Clink-arg=-sDEFAULT_TO_CXX",
  "-Clink-arg=-sWASM_BINDGEN",
  "-Clink-arg=-Wno-experimental",
  "-Clink-arg=-sMODULARIZE",
  "-Clink-arg=-sEXPORT_ES6",
  "-Clink-arg=-sMAX_WEBGL_VERSION=2",
  "-Clink-arg=-sMIN_WEBGL_VERSION=2",
]
