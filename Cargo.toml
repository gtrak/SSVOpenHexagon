[workspace]
resolver = "2"
members = [
    "crates/oh-math",
    "crates/oh-rng",
    "crates/oh-replay",
    "crates/oh-data",
    "crates/oh-vfs",
    "crates/oh-config",
    "crates/oh-lua",
    "crates/oh-assets",
    "crates/oh-game",
    "crates/oh-render",
    "crates/oh-menu-system",
    "crates/oh-menu",
    "crates/oh-app",
    "crates/oh-net",
    "crates/oh-server-control",
    "crates/oh-workshop-uploader",
    "crates/oh-steam",
    "crates/oh-discord",
    "crates/oh-parity",
    "crates/oh-android",
    "crates/oh-web",
]
# Later issues add workspace members as they land (PLAN.md architecture
# table): oh-timeline, oh-replay, oh-data, oh-config, oh-assets, oh-lua,
# oh-game, oh-audio, oh-net, oh-menu-system, oh-render, oh-menu, oh-app,
# oh-steam, oh-discord. (oh-discord landed with issue 21.)

[workspace.package]
version = "0.1.0"
edition = "2021"

# Pinned for later issues (issue 02: flate2; issues 03+: serde, serde_json,
# thiserror). Resolved workspace-wide; harmless while unused.
[workspace.dependencies]
# flate2 on its `zlib` feature (system libz via libz-sys), NOT the default
# miniz_oxide rust backend: the replay CZHEX oracle pin requires the *same
# deflate implementation as the C++ build (system zlib `compress2`, level 9)
# — see DECISIONS.md D-006 and .agents/skills/lib-flate2.md.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# sodiumoxide (0.2.7) is the contract choice for issue 016 (DECISIONS.md D-004
# sodium entry): it wraps libsodium 1.0.18 (built from source by
# libsodium-sys) and exposes the exact primitives the C++ uses — crypto_kx
# keypair/session keys, crypto_secretbox(_open)_easy, crypto_generichash,
# randombytes. See .agents/skills/lib-libsodium.md.
sodiumoxide = "0.2.7"
# rusqlite on its `bundled` feature (DECISIONS.md D-004 SQLite entry): the
# C++ side is sqlite_orm (vendored `public/sqlite_orm/sqlite_orm.h`) on the
# vendored SQLite C API (`public/sqlite/`), both writing `ohdb.sqlite`.
# The Rust port executes the hand-transcribed schema + queries (issue 17,
# `crates/oh-net/src/database.rs`) against the same file. `bundled`
# compiles the SQLite C engine from source (via `libsqlite3-sys`), matching
# the build-from-source pattern of `libsodium-sys` and avoiding a system
# sqlite dev-package dependency.
rusqlite = { version = "0.31", features = ["bundled"] }
# tempfile — test-only (issue 17's DB tests need isolated on-disk DB files).
tempfile = "3"
# steamworks (0.13.1) is the issue-20 binding (20-steam.md): it wraps the
# same Steam SDK the C++ links (the loader stubs ship inside
# steamworks-sys) and covers every ACTIVE Core/Steam.cpp call — init /
# user stats / friends / UGC + the callback pump. Documented gaps +
# fallbacks (hand-written `RequestCurrentStats` FFI; the encrypted-app-
# ticket `#if`-branch is inactive in this tree — see the skill):
# .agents/skills/lib-steamworks.md.
steamworks = "0.13"

# Profile tuning is finalized by issue 22 (builds/CI); issue 24 pins the
# release profile to the C++ release build's settings.
#
# The C++ release build's flags (D-014, cited):
#   * The build type is `RELEASE` everywhere the release intent is expressed:
#     `.github/workflows/ci_linux.yml` (`cmake -GNinja -DCMAKE_BUILD_TYPE=RELEASE`)
#     and `build.sh --mingw-release` (`build.sh:66-67` → `-DCMAKE_BUILD_TYPE=RELEASE`,
#     `build.sh:118`). CMake's GNU-compiler module then sets the release flags
#     to exactly `-O3 -DNDEBUG` (CMake Modules/Compiler/GNU.cmake:61 `-O3`,
#     :65 `-DNDEBUG`) — no custom optimization flags: `CMakeLists.txt:347-348`
#     leaves the common-compiler-flags call commented out ("TODO: decide how
#     to handle flags") and the whole LTO block is commented out
#     (`CMakeLists.txt:353-366`, "C++ had LTO commented out" — 24-packaging.md
#     step 1).
# The Rust mirror (and the deliberate non-mirrors):
#   * `-O3`       -> `opt-level = 3` (the Rust release default, now spelled out)
#   * `-DNDEBUG`  -> `debug-assertions = false` (the Rust release default,
#                    spelled out: `debug_assert!` off, mirroring disabled
#                    C++ `assert()`)
#   * LTO OFF     -> NO `lto` here. LTO changes the codegen pipeline the float
#                    math is verified on: the oh-game determinism harness and
#                    the whole release test suite are test-verified on the
#                    default release profile (D-000: arithmetic-exact port —
#                    float evaluation must stay identical to the verified
#                    default). The C++ build does not enable LTO either
#     (CMakeLists.txt:353-366), so keeping it OFF is also the faithful mirror.
#   * NO `strip` / `codegen-units` / `panic` overrides: the C++ release build
#     sets none of them, and they are not part of the test-verified baseline.
[profile.release]
opt-level = 3
debug-assertions = false
