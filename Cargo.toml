[workspace]
resolver = "2"
members = [
    "crates/oh-math",
    "crates/oh-rng",
    "crates/oh-replay",
    "crates/oh-data",
    "crates/oh-config",
    "crates/oh-lua",
    "crates/oh-assets",
    "crates/oh-game",
    "crates/oh-render",
    "crates/oh-menu-system",
    "crates/oh-menu",
    "crates/oh-app",
    "crates/oh-net",
    "crates/oh-server-control",
    "crates/oh-workshop-uploader",
]
# Later issues add workspace members as they land (PLAN.md architecture
# table): oh-timeline, oh-replay, oh-data, oh-config, oh-assets, oh-lua,
# oh-game, oh-audio, oh-net, oh-menu-system, oh-render, oh-menu, oh-app,
# oh-steam, oh-discord.

[workspace.package]
version = "0.1.0"
edition = "2021"

# Pinned for later issues (issue 02: flate2; issues 03+: serde, serde_json,
# thiserror). Resolved workspace-wide; harmless while unused.
[workspace.dependencies]
# flate2 on its `zlib` feature (system libz via libz-sys), NOT the default
# miniz_oxide rust backend: the replay CZHEX oracle pin requires the *same
# deflate implementation as the C++ build (system zlib `compress2`, level 9)
# — see DECISIONS.md D-006 and .agents/skills/lib-flate2.md.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# sodiumoxide (0.2.7) is the contract choice for issue 016 (DECISIONS.md D-004
# sodium entry): it wraps libsodium 1.0.18 (built from source by
# libsodium-sys) and exposes the exact primitives the C++ uses — crypto_kx
# keypair/session keys, crypto_secretbox(_open)_easy, crypto_generichash,
# randombytes. See .agents/skills/lib-libsodium.md.
sodiumoxide = "0.2.7"
# rusqlite on its `bundled` feature (DECISIONS.md D-004 SQLite entry): the
# C++ side is sqlite_orm (vendored `public/sqlite_orm/sqlite_orm.h`) on the
# vendored SQLite C API (`public/sqlite/`), both writing `ohdb.sqlite`.
# The Rust port executes the hand-transcribed schema + queries (issue 17,
# `crates/oh-net/src/database.rs`) against the same file. `bundled`
# compiles the SQLite C engine from source (via `libsqlite3-sys`), matching
# the build-from-source pattern of `libsodium-sys` and avoiding a system
# sqlite dev-package dependency.
rusqlite = { version = "0.31", features = ["bundled"] }
# tempfile — test-only (issue 17's DB tests need isolated on-disk DB files).
tempfile = "3"

# Profile tuning is finalized by issue 22 (builds/CI). opt-level is the
# default; recorded here so later issues have a place to change it.
[profile.release]
opt-level = 3
