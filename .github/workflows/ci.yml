name: CI

# Issue 037 — the port's per-push CI, written from scratch (replaces
# rust.yml; the upstream C++ workflows ci_linux.yml / ci_windows.yml were
# DELETED — the C++ tree is the archived reference now, verified locally
# through the container oracle, not a shipped artifact; CI Linux was stuck
# 'queued' on every push and CI Windows red, consistent with that).
#
# Job graph (every push + pull request, in parallel):
#   gate          — the port's own gate (tools/gate.sh: fmt / build /
#                   clippy -D warnings / test / lua-parity), matrix over
#                   ubuntu + windows
#   windows-cross — the x86_64-pc-windows-gnu cross-check (tools/
#                   build-windows.sh --check) on ubuntu. THIS JOB IS THE
#                   ONE THAT PROVED ITS WORTH: it is what catches
#                   Windows-target regressions that the host gate
#                   structurally cannot see — the host gate never
#                   compiles the Windows target, so "the host gate is not
#                   a Windows gate" (the sibling of "the host gate is not
#                   a web gate"). Lane 037 found master Windows-red from
#                   a usize-vs-c_uint in the signal write (the cross-check
#                   is the only place it was visible). Never drop this
#                   job.
#   android       — the fast android-target check (tools/check-android.sh:
#                   cargo check -p oh-app --target aarch64-linux-android,
#                   the NDK r27c pin). The slow, signing-dependent release
#                   APK (tools/package-android.sh) is a RELEASE-workflow
#                   job, not a per-push one.
#   wasm          — the emscripten compile proof (tools/package-web.sh:
#                   the full release build + the serve-dir staging + zip —
#                   the SAME command the release workflow runs; per push
#                   it is the compile proof, the release workflow uploads
#                   the artifact). On default-branch pushes it ALSO hands
#                   the staged _WEB directory to the pages job (artifact).
#   pages         — Issue 040 — the CONTINUOUS gh-pages deploy: every push
#                   to the default branch publishes the wasm build, so
#                   https://gtrak.github.io/SSVOpenHexagon/ always
#                   reflects master. Gated to default-branch pushes of
#                   this repo only — never PRs (event = pull_request),
#                   never tag pushes (ref = refs/tags/...), never forks
#                   (the github.repository guard: a fork's push must not
#                   be able to publish). It shares the gh-pages
#                   concurrency group with release.yml's gh-pages job,
#                   because after issue 040 the branch has TWO publishers
#                   (this job on master pushes, the release job on tag
#                   pushes) and a race that half-writes the branch is
#                   exactly the kind of thing nobody diagnoses later.
#
# ONE SOURCE OF TRUTH: every job invokes a tools/ script (tools/gate.sh,
# tools/build-windows.sh, tools/check-android.sh, tools/package-web.sh) —
# no build command exists inline in a workflow, so a local run and a CI
# run cannot drift. That drift is exactly how the Windows hole happened.
#
# THE PAGES PUBLISHERS (issue 040): ci.yml's pages job (this file) and
# release.yml's gh-pages job both write the gh-pages branch, so both carry
# concurrency { group: gh-pages, cancel-in-progress: false } and serialize.
# Who wins on a tag: both are kept. A tag cut on master's HEAD publishes
# identical bytes from both (no observable winner); a tag on an older or
# non-master commit gets its own release deploy, and the next master push
# re-pins the page to master — which is the operator's intent (the live
# page follows master; the released bytes are also captured in the
# release's artifact zip either way). Every write is a complete state
# (never half-written) because the two publishers never run at once.
#
# The pinned toolchain (1.97.1 + clippy + rustfmt) is the one in
# rust-toolchain.toml; the explicit install steps below mirror it so a
# pin failure is visible as its own step rather than buried in the gate's
# log (tools/gate.sh redirects stage output to target/gate.log).
#
# THE C++ ORACLE JOB — considered and deliberately left OUT: a
# workflow_dispatch-only oracle job (the C++ fingerprint column,
# tools/cpp-oracle/run.sh) is not bounded on a 4-core runner (dependency
# image build + CPM seeding + submodule init + a long SFML/LuaJIT/game
# build, several independent failure points stacked in one job) and its
# paths are in motion while the C++ tree moves into cpp-original/ in
# parallel. Once that landing settles and the build can be cached, a
# bounded workflow_dispatch-only oracle job can be added; until then the
# C++ column stays a local (dev-box) verification, by design.

on: [push, pull_request]

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain (mirrors rust-toolchain.toml)
        run: rustup toolchain install 1.97.1 --component clippy --component rustfmt

      # 29j1 — the desktop controller backend (gilrs -> libudev-sys on
      # LINUX only) needs the `libudev` system library at build time, so
      # the gate's `cargo build/test --workspace` needs it on the ubuntu
      # leg (present on ubuntu-latest; the defensive install mirrors the
      # mingw pattern). The windows leg does not need it (libudev-sys is
      # a Linux-only dep of gilrs-core).
      - name: libudev for the desktop controller backend (Linux only)
        if: runner.os == 'Linux'
        run: |
          pkg-config --exists libudev || sudo apt-get install -y libudev-dev

      # 044 — the audio backend (rodio -> cpal -> alsa-sys on LINUX only)
      # links the system ALSA library; alsa-sys's build script needs
      # `alsa.pc`. It is NOT on the ubuntu-latest image — the gate's
      # `cargo build --workspace` failed exactly here (run 39088375527:
      # "Package 'alsa' was not found in the pkg-config search path").
      # The windows leg does not need it (cpal's ALSA backend is
      # Linux-only).
      - name: ALSA for the audio backend (Linux only)
        if: runner.os == 'Linux'
        run: |
          pkg-config --exists alsa || sudo apt-get install -y libasound2-dev

      - name: Run the gate
        # git-bash on the windows runner / the default bash on ubuntu.
        run: bash tools/gate.sh

  windows-cross:
    name: Cross-check (x86_64-pc-windows-gnu on ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain (mirrors rust-toolchain.toml)
        run: rustup toolchain install 1.97.1 --component clippy --component rustfmt

      - name: MinGW cross toolchain (preinstalled on the image; defensive)
        run: |
          command -v x86_64-w64-mingw32-gcc || sudo apt-get install -y mingw-w64

      # cargo check --workspace --all-targets --target x86_64-pc-windows-gnu —
      # the fast cross signal (incl. the libsodium cross-prebuild; see the
      # script). --all-targets (the script's own flag): the LIB targets alone
      # miss the test-only platform code — issue 044's windows-msvc leg died
      # on `std::os::unix::fs::symlink` in oh-app's TEST targets (E0433),
      # invisible to the lib-only check. The Windows-target regression
      # catcher — never drop this job (see the file header).
      - name: Cross check
        run: bash tools/build-windows.sh --check --all-targets

  android:
    name: Android (aarch64 check, NDK r27c)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain (mirrors rust-toolchain.toml)
        run: rustup toolchain install 1.97.1 --component clippy --component rustfmt

      - name: The pinned NDK (r27c — what tools/android-env.sh requires)
        uses: android-actions/setup-android@v4
        with:
          # The script needs $ANDROID_HOME/ndk/27.2.12479018 (its
          # toolchain bin on PATH) — sdkmanager's ndk; pin layout.
          packages: "ndk;27.2.12479018"

      - name: Fast android-target check (the release APK is a release-workflow job)
        run: bash tools/check-android.sh

  wasm:
    name: Web (wasm compile proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain (mirrors rust-toolchain.toml)
        run: rustup toolchain install 1.97.1 --component clippy --component rustfmt

      - name: Emscripten (emcc on PATH)
        uses: emscripten-core/setup-emsdk@v16

      # -sWASM_BINDGEN (the root .cargo/config.toml): emcc runs the
      # wasm-bindgen CLI itself over the linked wasm, so the CLI must be
      # on the build PATH, version-matched to the lockfile (the script
      # re-checks the match and fails loudly on drift).
      - name: wasm-bindgen CLI (the lockfile's version)
        run: |
          WBG="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)"
          cargo install wasm-bindgen-cli --version "$WBG"

      # The web recipe (tools/package-web.sh: CXXFLAGS=-fwasm-exceptions +
      # the release build + the serve-dir staging + the zip) — the SAME
      # command the release workflow runs, so the per-push compile proof
      # and the released artifact cannot drift.
      - name: Build + stage
        run: bash tools/package-web.sh

      # Issue 040 — hand the staged serve directory to the pages job
      # (different runner: the artifact is the only channel). Default-
      # branch pushes to THIS repo only — the pages job is gated by the
      # same predicate, so a fork's push can neither stage nor publish.
      - name: Upload the staged serve directory (default-branch pushes only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'gtrak/SSVOpenHexagon'
        uses: actions/upload-artifact@v4
        with:
          name: web-publish
          path: target/package/web/_WEB

  pages:
    name: Pages (gh-pages, continuous — default-branch pushes only)
    needs: wasm
    # Issue 040 — the operator's directive: gh-pages hosts the wasm build
    # AUTOMATICALLY, not only on tags. Every push to the default branch
    # publishes. Never on PRs (event = pull_request), never on tag
    # pushes (ref = refs/tags/...), never on forks (the github.repository
    # guard — the spec's "a fork's push must not be able to publish":
    # a push to a fork's own master would match the bare default-branch
    # predicate, so the repo check makes the exclusion explicit; the fork
    # run's GITHUB_TOKEN could only ever write the fork, but this also
    # keeps forks from burning a build).
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'gtrak/SSVOpenHexagon'
    # Serialize with release.yml's gh-pages job (the other publisher of
    # this branch — tag pushes): queue, never cancel, never race.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # peaceiris/actions-gh-pages pushes the branch with GITHUB_TOKEN:
    # it needs contents: write (no pages: write — the Pages source is
    # "Deploy a branch", not the Actions flow; see the deploy step).
    permissions:
      contents: write
    steps:
      - name: Download the staged serve directory
        uses: actions/download-artifact@v4
        with:
          name: web-publish
          path: web-publish

      - name: Deploy to the gh-pages branch
        # The staged _WEB contents — page + oh-web.js + oh_web.wasm +
        # oh_web.data in ONE directory (the inline-deploy contract the
        # zip-root layout serves) — land at the gh-pages branch root.
        # The page's asset references are RELATIVE ("./oh-web.js"; the
        # loader finds oh_web.wasm / oh_web.data beside it), which is
        # what makes the PROJECT subpath gtrak.github.io/SSVOpenHexagon/
        # resolve — do not "fix" them into absolute paths.
        # OPERATOR-SIDE (the workflow cannot set it): Settings -> Pages
        # -> Source = "Deploy a branch", branch gh-pages, folder /
        # (root). has_pages is false today — nothing serves until the
        # operator flips it (a wrong pairing, e.g. "GitHub Actions",
        # is a silent 404).
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: web-publish
