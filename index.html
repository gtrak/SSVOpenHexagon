<!doctype html>
<!--
  oh-web (issue 26c W5, D-029) - the browser page for the REAL composition:
  oh_app::client::main_client (headless = false) boots config + assets over
  the _RELEASE tree preloaded into emscripten MEMFS at /RELEASE, the
  oh-render emscripten window over this <canvas id="c">, the engine +
  MenuGame, dispatches to the MENU, and drives it via request_animation_frame.

  SERVE (static, no build step): copy the THREE build artifacts next to this
  file (the .data is the --preload-file package - a missing one shows
  "still waiting on run dependencies"), then serve THIS folder:

      python3 -m http.server 8000 --directory <this folder>

  (Artifact names: the loader is `oh-web.js` (MODULARIZE + EXPORT_ES6,
  default-exports the Module factory) but emcc names the wasm after the
  object file - `oh_web.wasm` (underscore); the loader's locateFile looks
  for exactly `oh_web.wasm` beside `oh-web.js`. The `_RELEASE` tree is
  packed into `oh_web.data` and fetched relative to this page.)

  URL: http://localhost:8000/
  (Any static file server works - the page is plain ES-module + three files.)

  THE CANVAS (issue 32 - the REAL window size): the canvas fills the
  viewport (the CSS box), and the oh-render emscripten window sizes
  ITSELF to that box x the device pixel ratio (the 025g "config size !=
  real size" lesson - the menu layout + every hit test run in the real
  size, and a browser resize keeps it current through the page's
  `resize` event -> the port's `Resized` fold -> the canvas backing
  store + the GL viewport). `touch-action: none` makes the canvas the
  page's own touch surface (no scroll / zoom gesture steals a touch from
  the game) - the port's pointer feed (pointerdown/move/up/cancel +
  setPointerCapture) is the input story (issue 32).

  Expected browser console (the W5 real-composition boot - lane 026
  re-verified 2026-10-17; lane 048 adds the persistence gate's lines):
      oh-web: boot started (after __wasm_call_ctors)
      oh-web: awaiting the IndexedDB load (the page's FS.syncfs) before the composition boots
      oh-web: user data restored from IndexedDB (IDBFS /userdata, autoPersist on)
      oh-web: persisted user data ready (IDBFS /userdata) - booting the composition
      [web] main_client entry (t=0)
      [web] config loaded
      [web] assets loaded
      [web] entering create_window
      [web] windowed build entry
      [web] engine + menu composed (the four callback links bound)
      [web] client built (window + engine + menu)
      [web] rAF loop scheduled (the browser owns the frames)
      oh-web: main_client returned 0 (the rAF loop keeps driving the menu)
      oh-web: module loaded
      status booted=true;exit_code=0;ticks=<n>   (every 2s; ticks advance ~30 per poll)
  NOTE (lane 026): the composition's Rust `println!`/`eprintln!` lines do NOT
  land in the browser console - the emscripten fd 1/2 writes fall into the
  default `/dev/stdout -> /dev/tty` null path (no visible sink in this glue).
  The `[channel]` lines above reach the console through the `oh-game`
  `log_sink` hook (`oh-web`'s `boot()` installs the browser-console sink
  before `main` runs) - the engine's event-driven lines (Lua errors, the
  `[lua]` channel, replay, ...) route through the SAME sink.
  The canvas shows the MENU (the composition's first representative
  state); the rAF loop keeps driving it (emscripten EXIT_RUNTIME=0 keeps
  the runtime alive after main returns). Input (issue 32): keyboard on
  the page (the keys the game consumes are preventDefault'd - the page
  does not scroll on Space / the arrows), pointer + wheel on the canvas,
  and the gameplay touch overlay's on-screen buttons (issue 31's
  platform-neutral seam, fed by the same pointer events).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>SSVOpenHexagon (web)</title>
    <style>
      /* The canvas IS the window (issue 32 §2.3): its CSS box fills the
         viewport; the port's emscripten window measures it (x the device
         pixel ratio) and owns the backing store from there. */
      html, body { margin: 0; padding: 0; background: #111; color: #ddd;
                   font-family: monospace; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh;
               /* The canvas is the game's touch surface (issue 32): no
                  scroll / zoom / double-tap gestures may steal a pointer
                  from it (the port's pointer feed owns them). */
               touch-action: none; user-select: none;
               -webkit-user-select: none; }
      #status { position: fixed; top: 4px; right: 8px; font-size: 11px;
                opacity: 0.7; }
      /* issue 046 (F33, relocated by issue 055) - the fullscreen button
         (#fs): the config's `fullscreen` value's web applier (the port's
         emscripten window get-or-creates it; this declaration is the
         committed shell's contract - the Rust fallback's inline style
         carries the same values). TOP-RIGHT (the operator's "on top
         right and stay present" - issue 055 overrides 046's bottom-right
         placement + the game-state `display: none`: after the browser's
         own fullscreen exit (Esc / the Android back) the stale-config
         desync made the next tap a no-op, and with the button hidden in
         the game state there was no way back - the operator was
         stranded). PRESENT IN EVERY STATE: `display: none` stays the
         DEFAULT (a pre-JS / legacy page's button cannot swallow a
         touch - 046's invariant), the gate JS below shows it once the
         page's script runs. THE COLLISION (the exact failure 046 avoided
         by hiding the button in-game): the F31 action row (the port's
         gameplay touch overlay - REPLAY / RESTART / PAUSE in the
         TOP-RIGHT, `touch_overlay.rs`'s `button_centers`'s top row: PAD
         12 + BUTTON_HALF 32 - the y 12..76 band in REAL pixels) is drawn
         for the whole game state (`windowed.rs`'s overlay gate); a DOM
         button over it would swallow the PAUSE button's touches. The
         resolution (issue 055's "offset the button below the row" - the
         row's buttons are lane 054's, untouchable here): the gate JS
         places the button BELOW the band in EVERY state (the band's
         bottom edge in CSS px = 76 / devicePixelRatio, + a 12px gap; the
         `top: 12px` below is the pre-JS fallback spot only - the gate
         moves it on load). One fixed spot (no state-jump), out of the
         bottom-right RotateCW corner for good (046's hit-test property,
         re-asserted by the 055 probe). ~44px touch target,
         subtle/translucent, `pointer-events: auto` on itself only. The
         `html:fullscreen` flip is the `fullscreenchange`'s declarative
         half (the Esc / the Android back's exit updates the button's
         state - no JS listener needed). */
      #fs { position: fixed; right: 12px; top: 12px; width: 44px; height: 44px;
            display: none; padding: 0; border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px; background: rgba(255, 255, 255, 0.10);
            color: #ddd; opacity: 0.55; font-size: 20px; line-height: 1;
            cursor: pointer; touch-action: manipulation; pointer-events: auto;
            z-index: 10; -webkit-tap-highlight-color: transparent; }
      html:fullscreen #fs { background: rgba(255, 255, 255, 0.22);
            opacity: 0.8; }
    </style>
  </head>
  <body>
    <!-- The canvas oh-web's boot looks up: id "c" (the 26c.1 selector
         contract). The width/height attributes are the INITIAL backing
         store only - the boot's real-size measurement (the CSS box x the
         device pixel ratio) resizes them at context creation, and the
         page's `resize` event keeps them tracking the viewport. -->
    <canvas id="c" width="640" height="480"></canvas>
    <!-- issue 046 (F32) - the hidden-but-focusable IME input: the phone's
         soft keyboard's target (a mobile browser raises the on-screen
         keyboard ONLY for a focused editable element; the canvas's
         keydown listener never gets one). The oh-render emscripten window
         get-or-creates it (this declaration is the committed shell; the
         Rust fallback covers a page that predates it) and re-applies the
         attribute contract below (the Rust side is the single source of
         truth: `type="text" inputmode="text" autocapitalize="off"
         autocomplete="off" spellcheck="false" enterkeyhint="done"` + the
         off-screen / `opacity: 0` / 16 px style - NEVER `display: none`,
         browsers refuse to focus those; the 16 px floor keeps iOS from
         zooming the page on focus - the operator's target is Android
         Chrome, where the floor is harmless). It is focused on the menu's
         `is_entering_text` transition edge (the C++ `isEnteringText`'s
         port - the name entry + every text-entry state, never per frame)
         and blurred on leaving; its `input` / `compositionend` events feed
         the game's EXISTING entered-text sink (the issue-025d chain), and
         desktop typing into the page reaches the game through it too. -->
    <input id="ime" type="text" inputmode="text" autocapitalize="off"
           autocomplete="off" spellcheck="false" enterkeyhint="done"
           style="position: fixed; left: -10000px; top: 0; opacity: 0;
                  font-size: 16px;" />
    <div id="status">booting</div>
    <!-- issue 046 (F33, issue 055) - the fullscreen button: toggles the
         ported `fullscreen` config value (the `LinkedValue` - the single
         source of truth; the LAlt+Enter bind toggles the SAME value,
         so the button and the menu cannot disagree) and applies it
         through the browser Fullscreen API (the port's FINDING: it
         never applied the config anywhere - the C++ did at the window
         creation, `sf::Style::Fullscreen`). issue 055: TOP-RIGHT, present
         in EVERY state (the `placeFs` gate below: the band offset + the
         display), and the port re-syncs the config from the browser's
         ACTUAL state (`document.fullscreenElement`) on every
         `fullscreenchange` - the config, the button's appearance (the
         `html:fullscreen` flip) and the browser cannot disagree (the
         Esc / the Android back's external exit included). -->
    <button id="fs" aria-label="Toggle fullscreen">⛶</button>
    <script type="module">
      // MODULARIZE + EXPORT_ES6 (the 26c.1 recipe): the default export is
      // the Module factory; it resolves once the wasm + the wasm-bindgen
      // glue (including Rust main via addOnInit) have initialized.
      import Module from "./oh-web.js";

      // issue 048 (F34 / D-039) - durable user data (IndexedDB, via
      // emscripten IDBFS): the Rust boot (oh-web's `main`) does NOT run
      // the composition synchronously - it calls `ohWebPersistBoot` and
      // waits for this glue to finish, so the persisted user data is in
      // place BEFORE the composition reads config.json / Profiles. The
      // factory's config object IS the Module (the generated loader does
      // `var Module = moduleArg`), so `cfg` carries `Module.FS` /
      // `Module.IDBFS` (the -sEXPORTED_RUNTIME_METHODS=FS,IDBFS exports,
      // the root .cargo/config.toml's wasm flags) by the time `main` runs.
      // WHAT PERSISTS: the three writable paths under the base dir -
      // config.json + Profiles/ + Replays/ - symlinked into the /userdata
      // IDBFS mount (the C++'s CWD-relative names, the engine's std::fs
      // writes land in IndexedDB unchanged). WHAT DOES NOT: the preloaded
      // _RELEASE read-only content (22 MB) stays MEMFS - IDBFS is NEVER
      // mounted over /RELEASE, or a returning player would run a STALE
      // _RELEASE (persisted at deploy N) against a new oh_web.wasm (deploy
      // N+1). First run: /userdata is seeded from the shipped
      // config.json (the C++'s "the user starts from the shipped config"
      // shape) - a later deploy's shipped config does NOT clobber the
      // user's own (exactly the C++'s user-config-shadows-shipped shape).
      const cfg = {};
      globalThis.ohWebPersistBoot = (done) => {
        const fail = (why) => {
          console.warn("oh-web: persistence OFF (" + why + ") - session-only MEMFS");
          done();
        };
        const FS = cfg.FS;
        const IDBFS = cfg.IDBFS;
        if (!FS || !IDBFS) return fail("FS/IDBFS not on the module (the -lidbfs.js / -sEXPORTED_RUNTIME_METHODS flags)");
        const exists = (p) => { try { FS.stat(p); return true; } catch { return false; } };
        try {
          // 1. The ONE IDBFS mount: /userdata (the small user-data dir).
          //    autoPersist: emscripten's own persist-after-writes (every
          //    write under the mount queues a sync to IndexedDB at the
          //    end of the frame - profiles / replays reach IndexedDB as
          //    they are made; the flushSession below is the deterministic
          //    way-out flush, the autoPersist's setTimeout(0) may never
          //    run on a killed tab).
          FS.mkdirTree("/userdata");
          FS.mount(IDBFS, { autoPersist: true }, "/userdata");
          // 2. The load direction (IndexedDB -> /userdata) is ASYNC: the
          //    callback fires only when it settles (success OR failure -
          //    the failure degrades to session-only storage, the game
          //    still boots).
          FS.syncfs(true, () => {
            try {
              // 3. First-run seed + the writable-path symlinks (the
              //    engine's writes under /RELEASE land in /userdata):
              //    /RELEASE/config.json is a PRELOADED file (the shipped
              //    default) - seed /userdata with it when the user has no
              //    persisted one yet, then unlink + symlink; Profiles/ +
              //    Replays/ are NOT in the _RELEASE tree (the composition
              //    creates them - through the symlinks, into /userdata).
              if (!exists("/userdata/Profiles")) FS.mkdir("/userdata/Profiles");
              if (!exists("/userdata/Replays")) FS.mkdir("/userdata/Replays");
              if (!exists("/userdata/config.json"))
                FS.writeFile("/userdata/config.json", FS.readFile("/RELEASE/config.json"));
              FS.unlink("/RELEASE/config.json");
              FS.symlink("/userdata/config.json", "/RELEASE/config.json");
              FS.symlink("/userdata/Profiles", "/RELEASE/Profiles");
              FS.symlink("/userdata/Replays", "/RELEASE/Replays");
              console.log("oh-web: user data restored from IndexedDB (IDBFS /userdata, autoPersist on)");
              done();
            } catch (e) { fail("setup: " + e); }
          }, (e) => fail("syncfs load: " + e));
        } catch (e) { fail(String(e)); }
      };

      const mod = await Module(cfg);
      // issue 048 — the probe hook (tools/web-persist-probe.mjs reads the
      // persisted user data through the module's own FS, the same path the
      // engine writes through): the module factory's return carries the
      // #[wasm_bindgen] exports (status / save_session) + the runtime
      // methods (FS / IDBFS, the -sEXPORTED_RUNTIME_METHODS exports).
      globalThis.ohWebModule = mod;
      console.log("oh-web: module loaded");
      // issue 048 (F34 / D-039) - the web session's way-out persist: D-029's
      // rAF loop means the C++'s exit-save guards already dropped at
      // composition (the boot-time config), so the page re-fires them at the
      // session's REAL end (the in-session config / a run's scores reach
      // /userdata - `save_session` = the C++ pSaveAll + saveConfig pair,
      // the C++'s LIFO guard order) and flushes the IDBFS mount to
      // IndexedDB. The operators' Android Chrome discards BACKGROUNDED tabs:
      // `visibilitychange` (hidden) fires before the discard, `pagehide` on
      // close - a "sync at the end of main" design would have lost the data
      // on a phone.
      const flushSession = () => {
        try { mod.save_session(); } catch (e) { console.warn("oh-web: save_session failed", e); }
        const F = cfg.FS;
        if (F) F.syncfs(false, () => {}, (e) => console.warn("oh-web: final syncfs failed", e));
      };
      document.addEventListener("visibilitychange", () => { if (document.hidden) flushSession(); });
      window.addEventListener("pagehide", flushSession);
      // The CDP probe's per-step state read (issue 046): the module scope's
      // `mod` is not a global, so expose the `#[wasm_bindgen] status()`
      // probe on `window` (the probe's `window.ohStatus()` - the page's
      // 2 s console poll below stays the no-evaluate fallback).
      window.ohStatus = () => mod.status();
      // issue 046 (F33, issue 055) - the #fs button's placement +
      // presence gate: TOP-RIGHT, PRESENT IN EVERY STATE (the operator's
      // "on top right and stay present" - the pre-055 gate's game-state
      // `display: none` is GONE: the browser's own fullscreen exit left
      // the operator unable to reach the button - the exact state where
      // it was most needed, the desync's "first tap does nothing" made
      // unrecoverable without it). The F31 action row (the port's
      // gameplay overlay - REPLAY / RESTART / PAUSE in the top-right,
      // `touch_overlay.rs`'s `button_centers`'s top row: PAD 12 +
      // BUTTON_HALF 32 → the y 12..76 band in REAL pixels, drawn for the
      // whole game state) is the collision 046 avoided by hiding the
      // button in-game: a DOM button over it swallows the PAUSE button's
      // touches. The resolution (the 055 spec's "offset the button below
      // the row" - the row is lane 054's, untouchable here): the button
      // sits BELOW the band in EVERY state (the band's bottom edge in
      // CSS px = 76 / devicePixelRatio + a 12px gap): one fixed spot
      // (no state-jump between the menu and the game), never over the
      // row (drawn in the game state only anyway), out of the
      // bottom-right RotateCW corner for good (046's property, the 055
      // probe re-asserts it). The `resize` re-apply keeps the offset
      // honest when the DPR changes across a viewport change (the
      // fullscreen transition's second suspect - the band's CSS
      // position is DPR-scaled; the event-driven re-apply, the house
      // pattern - no poll). The port still dispatches the
      // `ohstatechange` edge (its own state-transition signal - the 046
      // gate's listener is gone with the state-dependent display; the
      // button no longer listens for it).
      function placeFs() {
        const fs = document.getElementById('fs');
        if (!fs) return;
        const dpr = window.devicePixelRatio || 1;
        // Below the F31 row's band (76 REAL px = PAD 12 + BUTTON_HALF
        // 32 × 2 - the top row's y 12..76; the CSS-px conversion is the
        // DPR divide - the overlay's geometry is the canvas backing
        // store's space, the DOM's is CSS px).
        fs.style.top = (76 / dpr + 12) + 'px';
        // Present in every state (the operator's "stay present"): the
        // menu's top-right corner is empty of game furniture (the 9-zone
        // grid's top band is a gesture zone, not a button - the corner
        // patch under the button is its own visible footprint, the
        // operator's mandated placement; the 055 probe asserts nothing
        // else the game owns is swallowed).
        fs.style.display = 'block';
      }
      window.addEventListener('resize', placeFs);
      placeFs(); // on load (the module load's post-boot menu)
      // issue 046 (F33) - the #fs's requestFullscreen PROMISE's async
      // verdict (the port's Rust binding - Element::request_fullscreen -
      // resolves the call's SYNCHRONOUS result; the browser's async
      // grant/deny of the transient user activation - the headless
      // CDP probe cannot grant it, the operator's real tap does -
      // surfaces as the promise's REJECTION). This listener routes
      // the fullscreen rejections to the [oh-web-fs] console line (the
      // wiring's async evidence the probe greps) and swallows the
      // unhandled-rejection console pollution (only FULLSCREEN
      // rejections - anything else stays unhandled, as before).
      window.addEventListener('unhandledrejection', (ev) => {
        const reason = String(ev.reason && (ev.reason.message || ev.reason));
        if (/fullscreen/i.test(reason)) {
          console.log(`[oh-web-fs] promise rejected: ${reason}`);
          ev.preventDefault();
        }
      });
      // issue 058 (F37) - the browser's built-in context menu on
      // right-click / long-press: suppressed on the game page (the
      // canvas + the document's listener scope). The C++ has no
      // emscripten build (verified: no emscripten target in
      // cpp-original) - there is no C++ behaviour to match, so this is
      // the D-034-class web-only platform affordance (the operator's
      // ruling: "the right-click web browser built-in menu should be
      // disabled on wasm"), and its home is this shell's listener
      // block (the visibilitychange / pagehide / resize / #fs home) -
      // NOT the ported window.rs (the ported code may READ the shell's
      // DOM where a ported behaviour needs geometry - the #fs
      // hit-test band, INTEROP - but must not ADD platform behaviour
      // the original lacks; this listener touches no Rust state, so it
      // needs no oh-additions half either). The EXCLUSION: #ime (the
      // soft-keyboard text field) - its context menu is the desktop
      // paste / copy affordance, a legitimate input path for the name
      // entry. The suppression also matters for INPUT FIDELITY: the
      // menu's appearance takes the page's focus - the 032
      // release-on-blur fold then fires LostFocus and releases every
      // held input (the release on a REAL focus loss is the C++'s own
      // behaviour - faithful; the menu appearing is the trigger this
      // removes, the faithful release stays).
      document.addEventListener('contextmenu', (ev) => {
        if (ev.target instanceof Element && ev.target.closest('#ime')) return;
        ev.preventDefault();
      });
      // Poll the #[wasm_bindgen] status() probe into the page + console.
      setInterval(() => {
        const s = mod.status();
        document.getElementById("status").textContent = "status: " + s;
        console.log("status " + s);
      }, 2000);
    </script>
  </body>
</html>
